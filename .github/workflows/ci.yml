name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter web lint

      - name: Build frontend
        run: pnpm --filter web build

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Build backend
        run: pnpm --filter api build

  # Deploy job hanya jalan di branch main dan setelah build-and-test lolos.
  # Isi step deploy sesuai platform pilihan kamu (Railway/Render/VPS/dll).
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO- tambahkan step deploy ke Vercel (web) dan Railway/Render (api)"
